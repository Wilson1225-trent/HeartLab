# fly.toml app configuration file generated for heartlab on 2026-10-09T21:22:21Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'heartlab'
primary_region = 'iad'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
